name: Build AutoTrain4NV
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AutoTrain4NV --add-data "header.png;." AutoTrain4NV.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoTrain4NV-Windows
          path: dist/AutoTrain4NV.exe
